# Throttle build concurrency to avoid HTTP 429 rate limits
org.gradle.parallel=false
org.gradle.workers.max=1
systemProp.org.gradle.internal.repository.max.tenants=1

# Extend connection and socket timeouts (in milliseconds)
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.http.connectionTimeout=120000

# Optimize memory allocation for single-worker execution
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX Support
android.useAndroidX=true
android.enableJetifier=true
